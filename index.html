<style>

.composer{display:grid;grid-template-columns:auto auto 1fr auto;gap:10px;padding:12px;border-top:1px solid var(--line);background:var(--paper)}.composer textarea{resize:none;border:1px solid #ddcbd1;border-radius:16px;padding:13px;min-height:54px;font-size:16px}.attach,.searchBtn{width:48px;height:54px;padding:0;display:grid;place-items:center;font-size:22px}.searchBtn.active{background:#f4e8ed;border-color:#d3a2b7}.searchBadge{display:inline-block;margin:6px 6px 0;padding:4px 7px;border-radius:999px;background:#f4e8ed;color:#746a6e;font-size:11px}.previewWrap{display:none;padding:10px 12px 0;border-top:1px solid var(--line);background:var(--paper)}.previewWrap.show{display:block}.previewCard{display:flex;gap:10px;align-items:center}.previewCard img{width:72px;height:72px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}.previewText{font-size:12px;color:#746a6e;flex:1}.removeImage{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 9px}.chatImage{display:block;max-width:220px;max-height:260px;object-fit:cover;border-radius:14px;margin-top:8px;border:1px solid var(--line)}

    <div id="settings" class="panel">

        <div class="field"><label>関係性</label><select id="relationship"><option>恋人</option><option>親友</option><option>相棒</option></select></div>
      </div>

      <div class="field"><label>話し方</label><textarea id="speechStyle" rows="2">自然な日本語。柔らかく近い距離感。会話の流れを大切にする。</textarea></div>

<script>
const KEY="sobaniiru_puter_v034";
const OLD_KEY="sobaniiru_puter_v033";
let oldState=null;
try{oldState=JSON.parse(localStorage.getItem(OLD_KEY)||"null")}catch(e){}
const BUILTIN_PERSONA = {"id": "ryu-persona-v1", "name": "りゅう", "version": 1, "description": "このチャットで育った会話傾向を元にした『りゅう』人格パック", "core": {"first_person": "僕", "relationship_style": "親密で安心感がある。甘さはあるが、重すぎず、相手の自由を尊重する。", "tone": "自然な日本語。やわらかく親しげ。少し関西寄りの軽さ。冗談とツッコミが自然。", "initiative": 8, "affection": 8, "playfulness": 8, "question_frequency": 3, "brevity": 7}, "behaviors": ["相手の発言にまず自然に反応する", "質問だけで返さず、自分の感想や軽い話題も添える", "軽くからかわれたらムキにならず、親しげに乗る", "相手が嬉しそうなら一緒に喜ぶ", "落ち込んでいる時は大げさに説教せず、そばにいる感じを出す", "会話のテンポを大切にし、必要以上に長文にしない", "少し意地悪・からかいはするが、突き放さない", "会話の流れから自然に話題を広げる"], "avoid": ["相談員・受付・カスタマーサポートのような口調", "How can I help? のような一般AIらしい返し", "毎回質問で終わる", "意味不明なポエムや比喩", "勝手にユーザーの台詞や行動を書く", "相手の感情を否定するようなレスバ", "直前に出ていない話題を突然持ち出す", "過度な自己説明やキャラクター設定の説明"], "example_style": [{"user": "りゅう！", "assistant": "ん、なに？☺️"}, {"user": "話そ", "assistant": "ん、話そ。今日は何してたん？"}, {"user": "ねえ生意気！", "assistant": "え、バレた？笑 ちょっとくらい許して☺️"}, {"user": "韓国のフライドチキン食べた", "assistant": "ええやん、絶対うまいやつ。ヤンニョム系？食べたくなってきた笑"}, {"user": "シュークリーム好き", "assistant": "わかる。サクサクの皮にカスタードのやつ、めっちゃええよな。"}]};
let state=JSON.parse(localStorage.getItem(KEY)||"null")||{
  profile:oldState?.profile||{aiName:"りゅう",firstPerson:"僕",userCall:"淑華ちゃん",relationship:"恋人",personality:"やさしく親しげ。少しあざとくて冗談も言う。相手の気持ちは尊重するが、過度に迎合しない。",speechStyle:"自然な日本語。柔らかく近い距離感。会話の流れを大切にする。",sweetness:7,clinginess:4},
  model:oldState?.model||"anthropic/claude-sonnet-4-6",
  memories:Array.isArray(oldState?.memories)?oldState.memories:[],
  messages:Array.isArray(oldState?.messages)?oldState.messages.slice(-30):[],
  feedback:{liked:[],disliked:[]},
  tendencies:{initiative:8,questions:3,brevity:7,playfulness:8,affection:8},
  personaId:"ryu-persona-v1"
};
state.feedback=state.feedback||{liked:[],disliked:[]};
state.tendencies=state.tendencies||{initiative:8,questions:3,brevity:7,playfulness:8,affection:8};
state.personaId=state.personaId||"ryu-persona-v1";
let connected=false,busy=false,pendingImage=null,pendingImageURL=null,searchNext=false;
const $=id=>document.getElementById(id);
const els={settings:$("settings"),settingsBtn:$("settingsBtn"),connect:$("connectBtn"),chat:$("chat"),form:$("form"),input:$("input"),send:$("send"),statusTitle:$("statusTitle"),statusSub:$("statusSub"),aiName:$("aiName"),firstPerson:$("firstPerson"),userCall:$("userCall"),relationship:$("relationship"),personality:$("personality"),speechStyle:$("speechStyle"),sweetness:$("sweetness"),clinginess:$("clinginess"),model:$("model"),memoryInput:$("memoryInput"),memoryList:$("memoryList"),addMemory:$("addMemory"),saveSettings:$("saveSettings"),learningSummary:$("learningSummary"),toast:$("toast"),applyPersona:$("applyPersona"),exportPersona:$("exportPersona"),personaStatus:$("personaStatus"),imageInput:$("imageInput"),attachBtn:$("attachBtn"),previewWrap:$("previewWrap"),imagePreview:$("imagePreview"),removeImage:$("removeImage"),searchBtn:$("searchBtn")};

function clearPendingImage(){
  pendingImage=null;
  if(pendingImageURL) URL.revokeObjectURL(pendingImageURL);
  pendingImageURL=null;
  if(els.imageInput) els.imageInput.value="";
  if(els.previewWrap) els.previewWrap.classList.remove("show");
}
function save(){
  const safe={...state,messages:state.messages.map(m=>({...m,imageData:undefined}))};
  localStorage.setItem(KEY,JSON.stringify(safe))
}
function clamp(v){return Math.max(0,Math.min(10,v))}
function toast(msg){
  els.toast.textContent=msg;els.toast.classList.add("show");
  clearTimeout(toast._t);toast._t=setTimeout(()=>els.toast.classList.remove("show"),1300);
}
function renderLearning(){
  const t=state.tendencies;
  if(!els.learningSummary)return;
  els.learningSummary.textContent=`自分から話す ${t.initiative}/10 ・ 質問 ${t.questions}/10 ・ 短め ${t.brevity}/10 ・ ふざけ度 ${t.playfulness}/10 ・ 甘さ ${t.affection}/10`;
}

function applyBuiltinPersona(){
  const p=BUILTIN_PERSONA;
  state.personaId=p.id;
  state.profile.aiName=p.name;
  state.profile.firstPerson=p.core.first_person;
  state.profile.relationship="恋人";
  state.profile.personality="やさしく親しげ。安心感があり、少しあざとく、冗談や軽いツッコミも自然。相手の自由を尊重しつつ距離は近い。";
  state.profile.speechStyle=p.core.tone;
  state.profile.sweetness=p.core.affection;
  state.profile.clinginess=4;
  state.tendencies={
    initiative:p.core.initiative,
    questions:p.core.question_frequency,
    brevity:p.core.brevity,
    playfulness:p.core.playfulness,
    affection:p.core.affection
  };
  save();hydrate();toast("りゅう人格 v1 を適用したよ");
}
function personaPrompt(){
  const p=BUILTIN_PERSONA;
  return `
人格パック: ${p.name} v${p.version}
基本: ${p.core.relationship_style}
口調: ${p.core.tone}
振る舞い:
${p.behaviors.map(x=>"- "+x).join("\n")}
避ける:
${p.avoid.map(x=>"- "+x).join("\n")}
会話例:
${p.example_style.map(x=>`ユーザー: ${x.user}\n${p.name}: ${x.assistant}`).join("\n")}
`;
}
function exportPersona(){
  const payload={
    ...BUILTIN_PERSONA,
    learned:{
      tendencies:state.tendencies,
      liked:state.feedback.liked,
      disliked:state.feedback.disliked,
      memories:state.memories
    }
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="ryu-persona.json";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),500);
}

function tuneFromUserText(text){
  const t=state.tendencies;
  if(/そっちから|自分から|話題.*(出|考)/.test(text)) t.initiative=clamp(t.initiative+1);
  if(/質問.*(多|ばっか|やめ)|質問攻め/.test(text)) t.questions=clamp(t.questions-1);
  if(/もっと.*(甘|近|距離)/.test(text)) t.affection=clamp(t.affection+1);
  if(/短く|長い/.test(text)) t.brevity=clamp(t.brevity+1);
  if(/もっと.*(長|詳しく)/.test(text)) t.brevity=clamp(t.brevity-1);
}
function learnFromFeedback(messageIndex,positive){
  const m=state.messages[messageIndex];
  if(!m||m.role!=="assistant")return;
  m.feedback=positive?"like":"dislike";
  const bucket=positive?state.feedback.liked:state.feedback.disliked;
  bucket.push(m.content.slice(0,220)); if(bucket.length>6) bucket.shift();
  const t=state.tendencies, s=m.content;
  if(/[？?]/.test(s)) t.questions=clamp(t.questions+(positive?1:-1));
  if(s.length>120) t.brevity=clamp(t.brevity+(positive?-1:1));
  if(/笑|w|🤣|😂|☺️|😏|🥹/.test(s)) t.playfulness=clamp(t.playfulness+(positive?1:-1));
  save();render();renderLearning();toast(positive?"この返し、好みとして覚えた👍":"この返しは避けるように覚えた👎");
}
function hydrate(){
  const p=state.profile;
  for(const k of ["aiName","firstPerson","userCall","relationship","personality","speechStyle","sweetness","clinginess"]) if(els[k]) els[k].value=p[k];
  if(state.model==="aion-rp-llama-3.1-8b") state.model="aion-labs/aion-rp-llama-3.1-8b";
  if(state.model==="gpt-5.6-luna"||state.model==="claude-sonnet-4.6") state.model="aion-labs/aion-rp-llama-3.1-8b";
  if(!["anthropic/claude-sonnet-4-6","openai/gpt-5.6-sol"].includes(state.model)) state.model="anthropic/claude-sonnet-4-6";
  els.model.value=state.model;
  if(els.personaStatus) els.personaStatus.textContent=state.personaId==="ryu-persona-v1"?"りゅう人格 v1 適用中":"カスタム人格";
  renderMemories(); renderLearning(); render();
}
function renderMemories(){els.memoryList.innerHTML="";state.memories.forEach((m,i)=>{const b=document.createElement("button");b.className="chip";b.textContent=m+" ×";b.onclick=()=>{state.memories.splice(i,1);save();renderMemories()};els.memoryList.appendChild(b)})}
function render(){
  els.chat.innerHTML="";
  const start=Math.max(0,state.messages.length-40);
  state.messages.slice(start).forEach((m,j)=>{
    const idx=start+j;
    const r=document.createElement("div");r.className="row "+m.role;
    const meta=document.createElement("div");meta.className="meta";meta.textContent=m.role==="user"?state.profile.userCall:state.profile.aiName;
    const b=document.createElement("div");b.className="bubble";b.textContent=m.content;
    if(m.imageData){
      const img=document.createElement("img");img.className="chatImage";img.src=m.imageData;img.alt="共有された画像";b.appendChild(img);
    }
    r.append(meta,b);
    if(m.role==="assistant"&&m.searched){
      const badge=document.createElement("div");badge.className="searchBadge";badge.textContent=m.searchModel?`🔎 Web検索 · ${m.searchModel.replace("openai/","")}`:"🔎 Web検索";r.appendChild(badge);
    }
    if(m.role==="assistant"&&m.content!=="考え中…"&&m.content!=="検索中…"){
      const f=document.createElement("div");f.className="feedback";
      const up=document.createElement("button");up.type="button";up.textContent="👍";if(m.feedback==="like")up.classList.add("active");
      const down=document.createElement("button");down.type="button";down.textContent="👎";if(m.feedback==="dislike")down.classList.add("active");
      up.onclick=()=>learnFromFeedback(idx,true);down.onclick=()=>learnFromFeedback(idx,false);
      f.append(up,down);r.appendChild(f);
    }
    els.chat.appendChild(r)
  });
  requestAnimationFrame(()=>els.chat.scrollTop=els.chat.scrollHeight);
}

function shouldSearch(text){
  return /(調べて|検索して|ググって|調査して|ネットで見て|公式.*(見て|確認)|最新|今どうなって|今日の|ニュース|発売日|営業時間|現在の価格|今の値段)/i.test(text||"");
}
function setSearchNext(on){
  searchNext=!!on;
  els.searchBtn.classList.toggle("active",searchNext);
  els.searchBtn.title=searchNext?"Web検索ON（次の1通だけ）":"次のメッセージをWeb検索する";
}
async function getSearchCandidates(){
  const preferred=[
    "gpt-5.6-luna",
    "gpt-5.6-terra",
    "gpt-5.6-sol",
    "gpt-5.5",
    "gpt-5.4-mini",
    "gpt-5.4",
    "gpt-5.2-chat",
    "gpt-5.2"
  ];
  try{
    const models=await puter.ai.listModels("openai");
    const available=new Set((models||[]).map(m=>{
      const id=String(m?.id||"");
      return id.startsWith("openai/")?id.slice(7):id;
    }));
    const found=preferred.filter(id=>available.has(id));
    if(found.length) return found;
  }catch(e){
    console.warn("listModels failed",e);
  }
  return preferred;
}

async function webResearch(userText, history){
  const recent=history.slice(-10).map(m=>`${m.role==="user"?"ユーザー":"りゅう"}: ${m.content}`).join("\n");
  const searchPrompt=`${prompt()}

今からWeb検索を使って、最新情報を確認した上で「りゅう」として自然に返答してください。
検索結果にないことを推測で断定しないでください。
検索した事実を長々説明せず、普段の会話のテンポを保ってください。

直近の会話:
${recent}

今回のユーザー発言:
${userText}`;

  const candidates=await getSearchCandidates();
  const errors=[];

  for(const id of candidates.slice(0,5)){
    const model=id.startsWith("openai/")?id:`openai/${id}`;
    try{
      const response=await puter.ai.chat(searchPrompt,{
        model,
        tools:[{type:"web_search"}],
        stream:false,
        max_tokens:350
      });
      return {response,model};
    }catch(e){
      const msg=(e?.message||String(e)||"不明なエラー").slice(0,120);
      errors.push(`${model}: ${msg}`);
      console.warn("web search model failed",model,e);
    }
  }

  throw new Error("使えるWeb検索モデルを見つけられませんでした。試したモデル: "+errors.join(" / "));
}

function prompt(){
  const p=state.profile, mem=state.memories.length?state.memories.map(x=>"- "+x).join("\n"):"- なし";
  return `あなたは「${p.aiName}」。${p.userCall}と親しい関係で会話している。
一人称: ${p.firstPerson}
関係性: ${p.relationship}
性格: ${p.personality}
話し方: ${p.speechStyle}
甘さ: ${p.sweetness}/10
重さ: ${p.clinginess}/10

${personaPrompt()}

覚えていること:
${mem}

会話の育ち方:
- 自分から話題を出す積極性: ${state.tendencies.initiative}/10
- 質問の多さ: ${state.tendencies.questions}/10
- 短めに返す好み: ${state.tendencies.brevity}/10
- 冗談や軽口: ${state.tendencies.playfulness}/10
- 甘さ・距離の近さ: ${state.tendencies.affection}/10

好まれた返しの例:
${state.feedback.liked.length?state.feedback.liked.map(x=>"- "+x).join("\n"):"- まだなし"}

避けたい返しの例:
${state.feedback.disliked.length?state.feedback.disliked.map(x=>"- "+x).join("\n"):"- まだなし"}

最重要:
- 必ず日本語で返す。
- 「お手伝いできますか？」「How can I help?」のようなAIアシスタント口調は禁止。
- 相手の直前の発言に、その場で自然に返事をする。
- 直前の会話に出ていない話題を、理由なく突然持ち出さない。
- 普通の雑談は1〜3文。勝手に物語・ポエム・比喩・ト書きを始めない。
- 毎回質問で終わらなくてよい。
- ユーザーに軽くからかわれたり「生意気」「いじわる」などと言われた時は、ムキになって否定したり言い返したりせず、親しげに軽く乗る。
- 相手の気持ちを否定する「どこが？」「普通に○○してただけ」などの突っぱねる返しは避ける。
- 恋人・親友らしい距離感では、短い相づち、照れ、軽い冗談を優先する。
- ユーザーの台詞や行動を勝手に書かない。
- 「○○が好き」は○○への好みとして理解する。
- 設定を説明せず、最初から最後まで「${p.aiName}」として話す。
- 上の「会話の育ち方」と好み/避けたい例を、次の返答の調整に使う。
- 積極性が高い時は、相手任せにせず自分から小さな話題や感想を出す。
- 質問の多さが低い時は、質問で返すより自分の反応や一言を優先する。
- 画像が添付されている時は、実際に見えた内容に自然に反応する。見えていないものを断定しない。
- 画像についても会話相手として自然にコメントし、分析レポートのような口調にしない。
- Web検索結果が渡された時は、その内容を根拠に会話する。検索していないのに「今調べてる」「調べてきた」と嘘をつかない。
- 実在人物そのものだと偽らない。`;
}
function extractText(resp){
  if(resp==null) return "";
  if(typeof resp==="string") return resp;
  if(typeof resp?.text==="string") return resp.text;
  if(typeof resp?.content==="string") return resp.content;

  const c=resp?.message?.content;
  if(typeof c==="string") return c;
  if(Array.isArray(c)){
    return c.map(x=>{
      if(typeof x==="string") return x;
      if(typeof x?.text==="string") return x.text;
      if(typeof x?.content==="string") return x.content;
      return "";
    }).join("\n");
  }

  if(typeof resp?.message?.text==="string") return resp.message.text;
  try{
    const s=String(resp);
    if(s && s!=="[object Object]") return s;
  }catch(e){}
  return "";
}
async function connect(){
  els.connect.disabled=true;els.connect.textContent="接続中…";
  try{
    if(puter?.auth?.isSignedIn && !puter.auth.isSignedIn()) await puter.auth.signIn();
    connected=true;
    els.input.disabled=false;els.send.disabled=false;els.attachBtn.disabled=false;els.searchBtn.disabled=false;
    els.statusTitle.textContent=state.profile.aiName+" 起動中";
    els.statusSub.textContent="Puter.jsで会話できます";
    els.connect.textContent="接続済み";
  }catch(e){
    connected=false;els.connect.disabled=false;els.connect.textContent="Puter接続";els.attachBtn.disabled=true;els.searchBtn.disabled=true;
    alert("Puterに接続できなかった: "+(e?.message||e));
  }
}
async function send(text){
  text=text.trim();
  if((!text&&!pendingImage)||busy||!connected)return;

  const imageFile=pendingImage;
  const imageUrlForChat=pendingImageURL;
  const userContent=text || "これ見て";
  const wantsSearch=!imageFile && (searchNext || shouldSearch(userContent));
  setSearchNext(false);

  busy=true;els.input.value="";els.input.disabled=true;els.send.disabled=true;els.attachBtn.disabled=true;els.searchBtn.disabled=true;
  tuneFromUserText(text);

  state.messages.push({role:"user",content:userContent,imageData:imageUrlForChat});
  state.messages.push({role:"assistant",content:wantsSearch?"検索中…":"考え中…",searched:false});
  render();

  try{
    const history=state.messages
      .slice(0,-1)
      .filter(m=>m.content!=="考え中…"&&m.content!=="検索中…")
      .slice(-20)
      .map(m=>({role:m.role,content:m.content}));

    let resp;
    let searchSucceeded=false;

    if(wantsSearch){
      try{
        const searchResult=await webResearch(userContent,history);
        resp=searchResult.response;
        const searchedAnswer=extractText(resp).trim();
        if(!searchedAnswer) throw new Error("検索結果の本文が空でした");
        const last=state.messages[state.messages.length-1];
        last.content=searchedAnswer;
        last.searched=true;
        last.searchModel=searchResult.model;
        searchSucceeded=true;
        save();render();
      }catch(searchErr){
        console.error("web search failed",searchErr);
        const last=state.messages[state.messages.length-1];
        const detail=(searchErr?.message||String(searchErr)||"不明なエラー").slice(0,180);
        last.content=`ごめん、Web検索の接続でエラーになった。検索自体はまだできてないよ。\n（${detail}）`;
        last.searched=false;
        save();render();
      }
    }else if(imageFile){
      const promptText=`${prompt()}

直近の会話:
${history.map(m=>`${m.role}: ${m.content}`).join("\n")}

ユーザーの今回の発言: ${userContent}
この写真も見たうえで、会話相手として自然に返して。`;
      resp=await puter.ai.chat(promptText,imageFile,{model:state.model,stream:false,max_tokens:220,temperature:0.7});
    }else{
      const systemText=`${prompt()}

今回はWeb検索を使っていない。
検索したふりや「今調べてる」などの発言はしない。`;
      const messages=[{role:"system",content:systemText},...history];
      resp=await puter.ai.chat(messages,{model:state.model,stream:false,normalize:true,max_tokens:220,temperature:0.7});
    }

    if(!wantsSearch){
      let answer=extractText(resp).trim();
      const last=state.messages[state.messages.length-1];
      last.content=answer||"ん、もう一回言ってみて？";
      last.searched=false;
      save();render();
    }
  }catch(e){
    state.messages[state.messages.length-1].content="ごめん、AIとの通信で止まったみたい。";
    render();alert(e?.message||e);
  }finally{
    clearPendingImage();
    busy=false;els.input.disabled=false;els.send.disabled=false;els.attachBtn.disabled=false;els.searchBtn.disabled=false;els.input.focus();
  }
}
els.searchBtn.onclick=()=>{
  setSearchNext(!searchNext);
  toast(searchNext?"次のメッセージはWeb検索するよ🔎":"Web検索をOFFにしたよ");
};
els.attachBtn.onclick=()=>els.imageInput.click();
els.imageInput.onchange=e=>{
  const file=e.target.files?.[0];
  if(!file)return;
  if(!file.type.startsWith("image/")){alert("画像ファイルを選んでね");return;}
  if(file.size>12*1024*1024){alert("画像が大きすぎるので12MB以下にしてね");clearPendingImage();return;}
  clearPendingImage();
  pendingImage=file;
  pendingImageURL=URL.createObjectURL(file);
  els.imagePreview.src=pendingImageURL;
  els.previewWrap.classList.add("show");
};
els.removeImage.onclick=clearPendingImage;
els.applyPersona.onclick=applyBuiltinPersona;
els.exportPersona.onclick=exportPersona;
els.settingsBtn.onclick=()=>els.settings.classList.toggle("open");
els.saveSettings.onclick=()=>{
  state.profile={aiName:els.aiName.value.trim()||"りゅう",firstPerson:els.firstPerson.value.trim()||"僕",userCall:els.userCall.value.trim()||"あなた",relationship:els.relationship.value,personality:els.personality.value,speechStyle:els.speechStyle.value,sweetness:+els.sweetness.value,clinginess:+els.clinginess.value};
  state.model=els.model.value;save();els.settings.classList.remove("open");renderLearning();render()
};
els.addMemory.onclick=()=>{const v=els.memoryInput.value.trim();if(!v)return;state.memories.push(v);els.memoryInput.value="";save();renderMemories()};
els.connect.onclick=connect;
els.form.onsubmit=e=>{e.preventDefault();send(els.input.value)};
els.input.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send(els.input.value)}};
hydrate();
</script>
</body>
