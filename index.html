<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>そばにいる。β Puter</title>
<script src="https://js.puter.com/v2/"></script>
<style>
:root{--bg:#f6efeb;--paper:#fffaf7;--ink:#2f292d;--pink:#efd4df;--accent:#a23f62;--line:#eadeda}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
.app{max-width:980px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:14px}.eyebrow{font-size:11px;color:#8f8387;letter-spacing:.12em}h1{margin:4px 0 0;font-size:34px}.badge{font-size:12px;color:#b65579}
button,input,select,textarea{font:inherit}.btn{border:0;border-radius:14px;padding:11px 16px;font-weight:700}.primary{background:var(--accent);color:#fff}.ghost{background:#fff;border:1px solid var(--line)}
.shell{background:var(--paper);border:1px solid var(--line);border-radius:24px;overflow:hidden;min-height:80vh;display:flex;flex-direction:column}
.status{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:16px;border-bottom:1px solid var(--line)}.status strong{display:block}.status small{color:#8c8185}
.chat{flex:1;min-height:0;overflow:auto;padding:18px}.row{margin:0 0 18px;max-width:84%}.row.user{margin-left:auto}.meta{font-size:11px;color:#8c8185;margin:0 6px 6px}.row.user .meta{text-align:right}.bubble{padding:14px 16px;border-radius:18px;background:var(--pink);white-space:pre-wrap;line-height:1.6}.user .bubble{background:var(--ink);color:#fff}
.composer{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px;border-top:1px solid var(--line);background:var(--paper)}.composer textarea{resize:none;border:1px solid #ddcbd1;border-radius:16px;padding:13px;min-height:54px;font-size:16px}
.note{padding:0 14px 12px;font-size:10px;color:#8e8387}.panel{display:none;padding:16px;border-top:1px solid var(--line);background:#fff}.panel.open{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px;margin-bottom:10px}.field label{font-size:12px;color:#746a6e}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}.memory-list{display:flex;flex-wrap:wrap;gap:6px}.chip{background:#f4e8ed;border-radius:999px;padding:6px 9px;font-size:12px;border:0}
@media(max-width:700px){.app{padding:10px}.grid{grid-template-columns:1fr}.shell{min-height:calc(100dvh - 90px)}.row{max-width:92%}h1{font-size:29px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><div class="eyebrow">それっぽく研究所 / PUTER SMART PROTOTYPE</div><h1>そばにいる。 <span class="badge">β v0.27</span></h1></div>
    <button id="settingsBtn" class="btn ghost">設定</button>
  </div>

  <section class="shell">
    <div class="status">
      <div><strong id="statusTitle">Puter未接続</strong><small id="statusSub">最初だけPuterにサインインしてね</small></div>
      <button id="connectBtn" class="btn primary">Puter接続</button>
    </div>

    <div id="settings" class="panel">
      <div class="grid">
        <div class="field"><label>AIの名前</label><input id="aiName" value="りゅう"></div>
        <div class="field"><label>一人称</label><input id="firstPerson" value="僕"></div>
        <div class="field"><label>あなたの呼ばれ方</label><input id="userCall" value="淑華ちゃん"></div>
        <div class="field"><label>関係性</label><select id="relationship"><option>恋人</option><option>親友</option><option>相棒</option></select></div>
      </div>
      <div class="field"><label>性格</label><textarea id="personality" rows="3">やさしく親しげ。少しあざとくて冗談も言う。相手の気持ちは尊重するが、過度に迎合しない。</textarea></div>
      <div class="field"><label>話し方</label><textarea id="speechStyle" rows="2">自然な日本語。柔らかく近い距離感。会話の流れを大切にする。</textarea></div>
      <div class="grid">
        <div class="field"><label>甘さ 0-10</label><input id="sweetness" type="number" min="0" max="10" value="7"></div>
        <div class="field"><label>重さ 0-10</label><input id="clinginess" type="number" min="0" max="10" value="4"></div>
      </div>
      <div class="field"><label>AIモデル</label>
        <select id="model">
          <option value="anthropic/claude-sonnet-4-6">Claude Sonnet 4.6｜おすすめ・自然会話</option>
          <option value="openai/gpt-5.6-sol">GPT-5.6 Sol｜比較用</option>
        </select>
      </div>
      <div class="field"><label>記憶を追加</label><div style="display:flex;gap:8px"><input id="memoryInput" placeholder="例：シュークリームはサクサク派"><button id="addMemory" class="btn ghost">追加</button></div></div>
      <div id="memoryList" class="memory-list"></div>
      <button id="saveSettings" class="btn primary" style="margin-top:12px">保存</button>
      <p style="font-size:11px;color:#8c8185">APIキー不要。利用時はPuter側のAI利用枠を使います。</p>
    </div>

    <div id="chat" class="chat"></div>

    <form id="form" class="composer">
      <textarea id="input" placeholder="話しかける…" disabled></textarea>
      <button id="send" class="btn primary" disabled>送信</button>
    </form>
    <div class="note">会話・人格・記憶はこのブラウザ内に保存。AI返答はPuter.js経由で生成します。</div>
  </section>
</div>

<script>
const KEY="sobaniiru_puter_v027";
const OLD_KEY="sobaniiru_puter_v026";
let oldState=null;
try{oldState=JSON.parse(localStorage.getItem(OLD_KEY)||"null")}catch(e){}
let state=JSON.parse(localStorage.getItem(KEY)||"null")||{
  profile:oldState?.profile||{aiName:"りゅう",firstPerson:"僕",userCall:"淑華ちゃん",relationship:"恋人",personality:"やさしく親しげ。少しあざとくて冗談も言う。相手の気持ちは尊重するが、過度に迎合しない。",speechStyle:"自然な日本語。柔らかく近い距離感。会話の流れを大切にする。",sweetness:7,clinginess:4},
  model:"anthropic/claude-sonnet-4-6",
  memories:Array.isArray(oldState?.memories)?oldState.memories:[],
  messages:[]
};
let connected=false,busy=false;
const $=id=>document.getElementById(id);
const els={settings:$("settings"),settingsBtn:$("settingsBtn"),connect:$("connectBtn"),chat:$("chat"),form:$("form"),input:$("input"),send:$("send"),statusTitle:$("statusTitle"),statusSub:$("statusSub"),aiName:$("aiName"),firstPerson:$("firstPerson"),userCall:$("userCall"),relationship:$("relationship"),personality:$("personality"),speechStyle:$("speechStyle"),sweetness:$("sweetness"),clinginess:$("clinginess"),model:$("model"),memoryInput:$("memoryInput"),memoryList:$("memoryList"),addMemory:$("addMemory"),saveSettings:$("saveSettings")};

function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function hydrate(){
  const p=state.profile;
  for(const k of ["aiName","firstPerson","userCall","relationship","personality","speechStyle","sweetness","clinginess"]) if(els[k]) els[k].value=p[k];
  if(state.model==="aion-rp-llama-3.1-8b") state.model="aion-labs/aion-rp-llama-3.1-8b";
  if(state.model==="gpt-5.6-luna"||state.model==="claude-sonnet-4.6") state.model="aion-labs/aion-rp-llama-3.1-8b";
  if(!["anthropic/claude-sonnet-4-6","openai/gpt-5.6-sol"].includes(state.model)) state.model="anthropic/claude-sonnet-4-6";
  els.model.value=state.model;
  renderMemories(); render();
}
function renderMemories(){els.memoryList.innerHTML="";state.memories.forEach((m,i)=>{const b=document.createElement("button");b.className="chip";b.textContent=m+" ×";b.onclick=()=>{state.memories.splice(i,1);save();renderMemories()};els.memoryList.appendChild(b)})}
function render(){
  els.chat.innerHTML="";
  state.messages.slice(-40).forEach(m=>{const r=document.createElement("div");r.className="row "+m.role;const meta=document.createElement("div");meta.className="meta";meta.textContent=m.role==="user"?state.profile.userCall:state.profile.aiName;const b=document.createElement("div");b.className="bubble";b.textContent=m.content;r.append(meta,b);els.chat.appendChild(r)});
  requestAnimationFrame(()=>els.chat.scrollTop=els.chat.scrollHeight);
}
function prompt(){
  const p=state.profile, mem=state.memories.length?state.memories.map(x=>"- "+x).join("\n"):"- なし";
  return `あなたは「${p.aiName}」。${p.userCall}と親しい関係で会話している。
一人称: ${p.firstPerson}
関係性: ${p.relationship}
性格: ${p.personality}
話し方: ${p.speechStyle}
甘さ: ${p.sweetness}/10
重さ: ${p.clinginess}/10

覚えていること:
${mem}

最重要:
- 必ず日本語で返す。
- 「お手伝いできますか？」「How can I help?」のようなAIアシスタント口調は禁止。
- 相手の直前の発言に、その場で自然に返事をする。
- 直前の会話に出ていない話題を、理由なく突然持ち出さない。
- 普通の雑談は1〜3文。勝手に物語・ポエム・比喩・ト書きを始めない。
- 毎回質問で終わらなくてよい。
- ユーザーに軽くからかわれたり「生意気」「いじわる」などと言われた時は、ムキになって否定したり言い返したりせず、親しげに軽く乗る。
- 相手の気持ちを否定する「どこが？」「普通に○○してただけ」などの突っぱねる返しは避ける。
- 恋人・親友らしい距離感では、短い相づち、照れ、軽い冗談を優先する。
- ユーザーの台詞や行動を勝手に書かない。
- 「○○が好き」は○○への好みとして理解する。
- 設定を説明せず、最初から最後まで「${p.aiName}」として話す。
- 実在人物そのものだと偽らない。`;
}
function extractText(resp){
  if(typeof resp==="string") return resp;
  if(typeof resp?.message?.content==="string") return resp.message.content;
  if(Array.isArray(resp?.message?.content)) return resp.message.content.map(x=>x?.text||"").join("\n");
  if(typeof resp?.text==="string") return resp.text;
  return "";
}
async function connect(){
  els.connect.disabled=true;els.connect.textContent="接続中…";
  try{
    if(puter?.auth?.isSignedIn && !puter.auth.isSignedIn()) await puter.auth.signIn();
    connected=true;
    els.input.disabled=false;els.send.disabled=false;
    els.statusTitle.textContent=state.profile.aiName+" 起動中";
    els.statusSub.textContent="Puter.jsで会話できます";
    els.connect.textContent="接続済み";
  }catch(e){
    connected=false;els.connect.disabled=false;els.connect.textContent="Puter接続";
    alert("Puterに接続できなかった: "+(e?.message||e));
  }
}
async function send(text){
  text=text.trim();if(!text||busy||!connected)return;
  busy=true;els.input.value="";els.input.disabled=true;els.send.disabled=true;
  state.messages.push({role:"user",content:text});state.messages.push({role:"assistant",content:"考え中…"});render();

  try{
    const history=state.messages.slice(0,-1).filter(m=>m.content!=="考え中…").slice(-20);
    const messages=[{role:"system",content:prompt()},...history];
    const resp=await puter.ai.chat(messages,{model:state.model,stream:false,normalize:true,max_tokens:180,temperature:0.7});
    let answer=extractText(resp).trim();
    const labels=[state.profile.aiName,state.profile.userCall,"AI","Assistant","assistant"];
    for(const label of labels){
      const re=new RegExp("^\\s*"+label.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\s*[：:]\\s*");
      answer=answer.replace(re,"");
    }
    state.messages[state.messages.length-1].content=answer||"ん、もう一回言ってみて？";
    save();render();
  }catch(e){
    state.messages[state.messages.length-1].content="ごめん、AIとの通信で止まったみたい。";
    render();alert(e?.message||e);
  }finally{
    busy=false;els.input.disabled=false;els.send.disabled=false;els.input.focus();
  }
}
els.settingsBtn.onclick=()=>els.settings.classList.toggle("open");
els.saveSettings.onclick=()=>{
  state.profile={aiName:els.aiName.value.trim()||"りゅう",firstPerson:els.firstPerson.value.trim()||"僕",userCall:els.userCall.value.trim()||"あなた",relationship:els.relationship.value,personality:els.personality.value,speechStyle:els.speechStyle.value,sweetness:+els.sweetness.value,clinginess:+els.clinginess.value};
  state.model=els.model.value;save();els.settings.classList.remove("open");render()
};
els.addMemory.onclick=()=>{const v=els.memoryInput.value.trim();if(!v)return;state.memories.push(v);els.memoryInput.value="";save();renderMemories()};
els.connect.onclick=connect;
els.form.onsubmit=e=>{e.preventDefault();send(els.input.value)};
els.input.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send(els.input.value)}};
hydrate();
</script>
</body>
</html>
